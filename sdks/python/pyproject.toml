[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etrace-py"
version = "0.1.0"
description = "AI agent tracing library — zero-dep core with pluggable exporters"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Evaris", email = "dev@evaris.ai" }]
keywords = ["tracing", "observability", "ai", "llm", "opentelemetry", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
]

dependencies = []

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
all = [
    "etrace-py[otel]",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "openai",
    "anthropic",
]

[tool.hatch.build.targets.wheel]
packages = ["src/etrace", "src/etrace_evaris"]

[tool.hatch.build.targets.sdist]
only-include = ["src/etrace", "src/etrace_evaris"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: pure unit test, no OTel, no network",
    "integration: uses InMemorySpanExporter or VCR",
    "e2e: requires real API keys and backend",
    "compat: compatibility suite test",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
preview = false
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify (SIM117 ignored below)
    "TCH",    # flake8-type-checking
    "RUF100", # unused noqa
    "PGH004", # blanket noqa
]
ignore = [
    "E501",   # line length handled by formatter
    "SIM117", # nested with is normal for pytest.raises + context managers
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["etrace", "etrace_evaris"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
[[tool.mypy.overrides]]
module = ["opentelemetry.*", "openai.*", "anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false
