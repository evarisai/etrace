name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: uv sync --all-extras --dev
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy src
      - run: uv run pytest -m "not e2e"
      - run: uv build

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  studio:
    name: Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etrace-studio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check "**/*.{ts,tsx,js,jsx}"
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  examples:
    name: Examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/mastra-weather-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Mastra Weather Agent
        working-directory: examples/mastra-weather-agent
        run: |
          npm install --ignore-scripts
          npx tsc --noEmit
      - name: Deep Research Agent
        working-directory: examples/deep-research-agent
        run: |
          python -c "import ast; ast.parse(open('agent.py').read()); print('syntax OK')"
